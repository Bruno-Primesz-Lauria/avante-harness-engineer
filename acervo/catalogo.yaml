nota: >
  Inventário das peças do desenho. Nenhum código lê este arquivo.
  estado: politica = há texto de política no núcleo; implementado = há código
  que aplica a guarda (política em guardas/README.md); candidato = não
  implementado, só descrito aqui; coberto = papel atendido por skill instalada.
  Para subagentes, politica registra aprovação do desenho; instalado registra
  presença da definição nativa em cada runtime; observado só registra chamada
  real em sessão, com versão, data e referência. Pendente não é evidência.
  Skills de plataforma (databricks-*, aitools v0.2.10) não entram aqui:
  roteamento em trilhas/README.md#skills-databricks.
